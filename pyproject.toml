[project]
name = "chuard"
version = "0.1.0"
description = "Base académica para predicción y análisis de abandono Telco"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/Jacklb19/Chuard"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
